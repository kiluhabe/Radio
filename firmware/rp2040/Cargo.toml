[package]
name = "firmware-rp2040"
version = "0.1.0"
edition = "2021"

# Standalone workspace: firmware/rp2040 sits inside the parent workspace's
# directory tree but must not join it (its .cargo/config.toml sets an
# embedded target, which would break `radio-core`'s host builds). An empty
# [workspace] table here tells cargo this crate roots its own workspace.
[workspace]

[dependencies]
radio-core = { path = "../../radio-core" }
rp-pico = "0.9"
cortex-m = "0.7"
cortex-m-rt = "0.7"
embedded-hal = "1.0"
# rda5807m 0.1.0 is written against the pre-1.0 embedded-hal blocking I2C
# traits (Write/Read/WriteRead), not the embedded-hal 1.0 `I2c` trait used
# elsewhere in this crate. rp2040-hal already implements both generations
# for its I2C peripheral, so both dependencies coexist without conflict.
embedded-hal-02 = { package = "embedded-hal", version = "0.2.7" }
rda5807m = "0.1"
ssd1306 = "0.9"
embedded-graphics = "0.8"
heapless = "0.8"
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }
# Pinned to 0.5 (not the newer 0.6) deliberately: 0.6 depends on
# rp2040-hal 0.11, while rp-pico 0.9 depends on rp2040-hal 0.10.2. With
# both in the dependency graph, fat LTO (see [profile.release] below)
# fails to link with "symbol multiply defined" for compiler-builtins
# globals. 0.5 depends on rp2040-hal ^0.10, so it unifies with rp-pico's
# and the graph carries only one rp2040-hal version. Confined to
# src/adapters/storage.rs only.
rp2040-flash = "0.5"

[[bin]]
name = "firmware-rp2040"
path = "src/main.rs"
test = false
bench = false

[profile.release]
debug = true
lto = true
opt-level = "s"
